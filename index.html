<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starfall 3D</title>
  <link rel="stylesheet" href="css/jogo.css">
</head>
<body>
  <!-- Camada de renderizacao 3D e interface sobreposta do jogo. -->
  <canvas id="game"></canvas>
  <div id="scene-transition"></div>
  <div id="hud">
    <div class="topbar hidden" id="game-hud">
      <div class="hud-card score-card"><span class="hud-label">PONTUAÇÃO</span><strong id="score">000000</strong></div>
      <div class="hud-card" id="objective-progress"><span class="hud-label">ALVOS</span><strong id="objective-count">0/50</strong></div>
      <div class="hud-card lives-card"><span class="hud-label">VIDAS</span><strong id="lives">&#9829; &#9829; &#9829;</strong></div>
    </div>
    <div id="special" class="hidden">Laser <span id="special-count">0/50</span><div id="special-track"><div id="special-fill"></div></div></div>
    <div id="missile-special" class="hidden">MISSEIS <span id="missile-count">0/15</span><div id="missile-track"><div id="missile-fill"></div></div></div>
    <div id="aim" class="hidden" aria-label="Mira"><div class="reticle"></div></div>
    <div id="message"><h1>STARFALL</h1><p>Uma nova dimensão para a sua missão.</p><button id="start">Abrir mapa</button><div id="loss-actions" class="loss-actions hidden"><button id="save-campaign">Salvar campanha</button><button id="return-missions">Voltar ao mapa</button><button id="close-game">Fechar jogo</button></div><div id="level-map" class="hidden"></div></div>
    <div id="pause-menu" class="hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="pause-panel">
        <h1 id="pause-title">JOGO PAUSADO</h1>
        <button id="resume-game">Continuar</button>
        <button id="main-menu">Voltar ao menu inicial</button>
        <button id="exit-game">Sair do jogo</button>
      </div>
    </div>
    <div id="boss-hud" class="hidden">CHEFE <div id="boss-track"><div id="boss-fill"></div></div></div>
    <div id="controls" class="hidden">WASD / SETAS: mover &nbsp; • &nbsp; ESPAÇO / BOTÃO ESQUERDO: disparar &nbsp; • &nbsp; X: laser &nbsp; • &nbsp; C: MÍSSEIS &nbsp; • &nbsp; ENTER: pausar</div>
  </div>

  <!-- O modulo de entrada inicializa cena, campanha, controles e game loop. -->
  <script type="module" src="javascript/jogo.js"></script>
</body>
</html>
